name: Deploy basketball-3d to GitHub Pages

on:
  push:
    branches:
      - claude/nba-2k-basketball-game-ne2lck
    paths:
      - 'basketball-3d/**'
      - '.github/workflows/deploy-basketball-3d.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: basketball-3d/package-lock.json

      - name: Install dependencies
        working-directory: basketball-3d
        run: npm ci

      - name: Typecheck
        working-directory: basketball-3d
        run: npm run typecheck

      - name: Build
        working-directory: basketball-3d
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: basketball-3d/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
